# Geri60+ Saúde — Nginx
# Copiar para /etc/nginx/sites-available/geri60saude.conf
# O frontend é servido diretamente pelo Nginx na porta 3021.

server {
    listen 3027;
    listen [::]:3027;
    server_name _;

    root /var/www/geri60saude/dist;
    index index.html;

    client_max_body_size 20m;

    # Assets com hash podem ser armazenados por longo período.
    location ^~ /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # A API permanece no Spring Boot, normalmente na porta 8080.
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }

    # Fallback do SPA para as rotas do TanStack Router.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
    }
}
