services:
  postgres:
    image: postgres:16-alpine
    container_name: geri60-postgres
    environment:
      POSTGRES_DB: geri60saude
      POSTGRES_USER: geri60
      POSTGRES_PASSWORD: geri60
    ports:
      - "5432:5432"
    volumes:
      - geri60_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U geri60 -d geri60saude"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  geri60_pgdata:
